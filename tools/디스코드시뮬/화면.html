<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아케이드봇 · 디스코드 시뮬레이터</title>
<style>
  :root { --bg:#1e1f22; --side:#2b2d31; --panel:#313338; --card:#2b2d31; --text:#dbdee1; --muted:#949ba4; --line:#3f4147; --blurple:#5865f2; --warn:#f0b232; --err:#f23f42; --ok:#23a55a; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.375 "gg sans","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; display:grid; grid-template-columns:230px minmax(0,1fr) 380px; overflow:hidden; }
  button,input,select,textarea { font:inherit; color:inherit; }
  /* ── 왼쪽 ── */
  #left { background:var(--side); display:flex; flex-direction:column; min-height:0; border-right:1px solid #1e1f22; }
  #left h2 { margin:0; padding:14px 14px 10px; font-size:15px; border-bottom:1px solid #1e1f22; }
  #left .sec { padding:10px 8px 4px; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.02em; }
  #left .ch { display:block; width:calc(100% - 8px); margin:1px 4px; text-align:left; background:none; border:0; border-radius:4px; padding:6px 8px; color:var(--muted); cursor:pointer; }
  #left .ch:hover { background:#35373c; color:var(--text); }
  #left .ch.on { background:#404249; color:#fff; }
  #me { margin-top:auto; padding:10px; border-top:1px solid #1e1f22; background:#232428; }
  #me label { display:block; color:var(--muted); font-size:11px; font-weight:700; margin-bottom:4px; }
  #me select { width:100%; background:#1e1f22; border:1px solid var(--line); border-radius:4px; padding:6px; }
  #me .hint { color:var(--muted); font-size:11px; margin-top:6px; }
  /* ── 가운데 ── */
  #center { display:flex; flex-direction:column; min-height:0; background:var(--panel); }
  #head { padding:12px 16px; border-bottom:1px solid #26272b; font-weight:700; display:flex; gap:10px; align-items:center; }
  #head .tag { font-weight:400; color:var(--muted); font-size:12px; }
  #head .raid { margin-left:auto; background:#5b3b00; color:#ffd479; border-radius:10px; padding:2px 10px; font-size:12px; font-weight:500; }
  #msgs { flex:1; overflow-y:auto; padding:10px 0 16px; }
  .msg { position:relative; padding:4px 16px 6px 72px; margin-top:10px; }
  .msg:hover { background:#2e3035; }
  .msg .avatar { position:absolute; left:16px; top:4px; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; }
  .msg .who { font-weight:600; color:#f2f3f5; }
  .msg .who .bot { background:var(--blurple); color:#fff; font-size:10px; border-radius:3px; padding:1px 5px; margin-left:6px; vertical-align:2px; }
  .msg .who .time { color:var(--muted); font-weight:400; font-size:11px; margin-left:8px; }
  .msg .via { color:var(--muted); font-size:12px; margin-bottom:2px; }
  .msg .via b { color:#c9cdfb; font-weight:600; }
  .msg.eph { background:rgba(88,101,242,.08); border-left:2px solid var(--blurple); }
  .msg .ephnote { color:var(--muted); font-size:12px; margin-top:4px; }
  .msg .thinking { color:var(--muted); font-style:italic; }
  .container { background:var(--card); border:1px solid #1e1f22; border-left:4px solid var(--accent,#4e5058); border-radius:8px; padding:14px 16px; margin:4px 0 6px; max-width:520px; }
  .container > *:first-child { margin-top:0; } .container > *:last-child { margin-bottom:0; }
  .section { display:flex; gap:14px; align-items:flex-start; justify-content:space-between; }
  .section .body { flex:1; min-width:0; }
  .thumb { width:72px; height:72px; border-radius:8px; object-fit:cover; flex:none; background:#1e1f22; }
  .text { white-space:pre-wrap; word-wrap:break-word; }
  .text h1 { font-size:20px; margin:0 0 2px; color:#f2f3f5; } .text h2 { font-size:17px; margin:2px 0; color:#f2f3f5; } .text h3 { font-size:15px; margin:2px 0; color:#f2f3f5; }
  .text .sub { font-size:12px; color:var(--muted); }
  .text blockquote { margin:2px 0; padding:0 0 0 10px; border-left:4px solid #4e5058; }
  .text code { background:#1e1f22; border-radius:3px; padding:1px 4px; font:12.5px Consolas,monospace; }
  .text pre { background:#1e1f22; border:1px solid var(--line); border-radius:4px; padding:6px 8px; margin:4px 0; font:12.5px/1.4 Consolas,"Malgun Gothic",monospace; white-space:pre-wrap; }
  .text .mention { background:rgba(88,101,242,.3); color:#c9cdfb; border-radius:3px; padding:0 2px; }
  .emoji { width:20px; height:20px; vertical-align:-4px; }
  hr.sep { border:0; border-top:1px solid var(--line); margin:10px 0; } hr.sep.nodiv { border-top-color:transparent; margin:4px 0; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; position:relative; }
  .btn { border:0; border-radius:3px; padding:2px 14px; height:32px; min-width:60px; color:#fff; font-weight:500; display:inline-flex; align-items:center; gap:6px; cursor:pointer; text-decoration:none; }
  .btn:hover { filter:brightness(1.12); } .btn:active { transform:translateY(1px); }
  .btn.s1 { background:#5865f2; } .btn.s2,.btn.s5 { background:#4e5058; } .btn.s3 { background:#248046; } .btn.s4 { background:#da373c; }
  .btn[disabled] { opacity:.45; cursor:not-allowed; filter:none; transform:none; }
  .select { flex:1 1 100%; background:#1e1f22; border:1px solid var(--line); border-radius:4px; padding:8px 10px; color:var(--muted); display:flex; justify-content:space-between; cursor:pointer; }
  .select[disabled] { opacity:.5; cursor:not-allowed; }
  .select:hover:not([disabled]) { border-color:#5a5d66; }
  .pop { position:absolute; z-index:20; top:100%; left:0; right:0; background:#111214; border:1px solid var(--line); border-radius:6px; max-height:260px; overflow:auto; box-shadow:0 8px 20px rgba(0,0,0,.5); }
  .pop .opt { padding:8px 10px; cursor:pointer; display:flex; gap:8px; align-items:flex-start; }
  .pop .opt:hover { background:#2b2d31; } .pop .opt.on { background:rgba(88,101,242,.25); }
  .pop .opt small { display:block; color:var(--muted); }
  .pop .ok { position:sticky; bottom:0; background:var(--blurple); text-align:center; padding:8px; cursor:pointer; font-weight:600; }
  .gallery { background:#1e1f22; border-radius:6px; overflow:hidden; margin:4px 0; max-width:520px; } .gallery img { display:block; width:100%; }
  .attach img { max-width:480px; border-radius:6px; margin-top:4px; }
  .embed { border-left:4px solid var(--accent,#4e5058); background:var(--card); border-radius:4px; padding:8px 12px 10px; margin:4px 0; max-width:480px; }
  .embed .et { font-weight:700; color:#f2f3f5; } .embed .ef { margin-top:6px; display:grid; grid-template-columns:repeat(3,1fr); gap:6px 12px; } .embed .ef b { display:block; font-size:13px; } .embed .foot { color:var(--muted); font-size:12px; margin-top:6px; }
  .missing { color:var(--warn); font-size:12px; }
  #composerBox { padding:0 16px 16px; position:relative; }
  #opts { background:#2b2d31; border:1px solid var(--line); border-radius:8px 8px 0 0; padding:10px 12px; display:none; gap:10px; flex-wrap:wrap; }
  #opts label { font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:3px; min-width:130px; }
  #opts input,#opts select { background:#1e1f22; border:1px solid var(--line); border-radius:4px; padding:5px 8px; color:var(--text); }
  #sug { position:absolute; left:16px; right:16px; bottom:56px; background:#2b2d31; border:1px solid var(--line); border-radius:8px; display:none; max-height:260px; overflow:auto; z-index:30; }
  #sug .it { padding:8px 12px; cursor:pointer; display:flex; gap:10px; } #sug .it:hover,#sug .it.on { background:#404249; } #sug .it span { color:var(--muted); }
  #composer { display:flex; gap:8px; background:#383a40; border-radius:8px; padding:6px; }
  #composer input { flex:1; background:none; border:0; outline:0; padding:6px 8px; }
  #composer button { background:var(--blurple); border:0; border-radius:4px; color:#fff; padding:6px 14px; cursor:pointer; }
  /* ── 오른쪽 ── */
  #right { background:var(--side); border-left:1px solid #1e1f22; display:flex; flex-direction:column; min-height:0; }
  #tabs { display:flex; border-bottom:1px solid #1e1f22; }
  #tabs button { flex:1; background:none; border:0; padding:12px 6px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; font-weight:600; }
  #tabs button.on { color:#fff; border-bottom-color:var(--blurple); }
  #panel { flex:1; overflow-y:auto; padding:12px; }
  .grp { background:#232428; border:1px solid #1e1f22; border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  .grp h4 { margin:0 0 8px; font-size:13px; } .grp p { margin:4px 0 8px; color:var(--muted); font-size:12px; }
  .f { display:flex; align-items:center; gap:8px; margin:6px 0; } .f > label:first-child { width:96px; color:var(--muted); font-size:12px; flex:none; }
  .f input[type=text],.f input[type=number],.f select { flex:1; min-width:0; background:#1e1f22; border:1px solid var(--line); border-radius:4px; padding:5px 8px; }
  .chk { display:flex; align-items:center; gap:6px; margin:4px 0; cursor:pointer; }
  .seg { display:flex; gap:6px; } .seg button { flex:1; background:#1e1f22; border:1px solid var(--line); border-radius:4px; padding:6px; cursor:pointer; } .seg button.on { background:var(--blurple); border-color:var(--blurple); color:#fff; }
  .mini { background:#404249; border:0; border-radius:4px; padding:5px 10px; cursor:pointer; } .mini:hover { background:#4e5058; } .mini.danger { background:#7a2528; } .mini.pri { background:var(--blurple); }
  .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .tr { background:#232428; border:1px solid #1e1f22; border-radius:8px; margin-bottom:10px; overflow:hidden; }
  .tr.bad { border-color:#7a2528; } .tr.warn { border-color:#7a5a12; }
  .tr .th { padding:7px 10px; font-weight:600; background:#2b2d31; display:flex; justify-content:space-between; gap:8px; }
  .tr .th small { color:var(--muted); font-weight:400; white-space:nowrap; }
  .st { padding:4px 10px; font-size:12.5px; border-top:1px solid #2b2d31; word-break:break-all; }
  .k-입력 { color:#8ea1ff; } .k-응답 { color:#57d18a; } .k-오류 { color:#ff8a8c; background:rgba(242,63,66,.1); } .k-규칙위반 { color:#ffd479; background:rgba(240,178,50,.1); } .k-경고 { color:#ffd479; } .k-메시지,.k-DM { color:var(--muted); } .k-설정 { color:#c9a3ff; }
  .empty { color:var(--muted); text-align:center; padding:30px 10px; }
  /* ── 모달 ── */
  #ov { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:100; }
  #modal { background:#313338; border-radius:8px; width:min(440px,92vw); max-height:90vh; overflow:auto; box-shadow:0 8px 40px rgba(0,0,0,.6); }
  #modal h3 { margin:0; padding:18px 20px 6px; font-size:20px; } #modal .mb { padding:6px 20px 14px; }
  #modal label.l { display:block; font-size:12px; font-weight:700; color:#b5bac1; margin:12px 0 6px; text-transform:uppercase; }
  #modal input,#modal textarea,#modal select { width:100%; background:#1e1f22; border:0; border-radius:3px; padding:10px; outline:0; }
  #modal textarea { min-height:100px; resize:vertical; }
  #modal .err { color:#ff8a8c; font-size:12px; margin-top:4px; }
  #modal .mf { background:#2b2d31; padding:14px 20px; display:flex; justify-content:flex-end; gap:10px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#111214; border:1px solid var(--line); padding:8px 16px; border-radius:8px; display:none; z-index:200; }
</style>
</head>
<body>
<aside id="left">
  <h2>🎮 아케이드 시뮬레이터</h2>
  <div id="chlist" style="flex:1;overflow:auto"></div>
  <div id="me"></div>
  <button id="restartBtn" class="mini" style="margin:0 10px 10px;padding:8px" title="handlers/·commands/ 등 봇 코드를 고쳤을 때">🔄 봇 코드 다시 불러오기</button>
</aside>
<section id="center">
  <div id="head"></div>
  <div id="msgs"></div>
  <div id="composerBox">
    <div id="sug"></div>
    <div id="opts"></div>
    <div id="composer"><input id="inp" autocomplete="off" placeholder="/ 를 눌러 슬래시 명령어를 쓰거나, 채팅(끝말잇기·오목·퀴즈 정답 등)을 입력하세요"><button id="sendBtn">전송</button></div>
  </div>
</section>
<aside id="right">
  <div id="tabs"><button data-tab="env" class="on">⚙️ 환경 설정</button><button data-tab="log">🧪 동작 기록</button></div>
  <div id="panel"></div>
</aside>
<div id="ov"><div id="modal"></div></div>
<div id="toast"></div>
<div id="conn" style="display:none;position:fixed;top:0;left:0;right:0;background:#7a2528;text-align:center;padding:6px;z-index:300">시뮬레이터 서버에 연결할 수 없어요 — <code>node tools/디스코드시뮬/실행.js</code> 로 켜 주세요 (자동 재연결 중)</div>

<script>
const BASE = new URLSearchParams(location.search).get('server') || (location.protocol === 'file:' ? 'http://localhost:5173' : '');
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let S = null, tab = 'env', view = { channel: null }, selUser = null, cmd = null, cmdOpts = {};
const api = (p, body) => fetch(BASE + p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) }).then(r => r.json()).then(j => { if (j.error) toast(j.error); return j; });
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2600); }
const nameOf = (id) => (S.env.users[id]?.name) || id;
const color = (id) => `hsl(${[...String(id)].reduce((a, c) => a * 31 + c.charCodeAt(0), 7) % 360} 45% 45%)`;

/* ───────── 마크다운 · 컴포넌트 그리기 ───────── */
function inline(s) {
  s = esc(s);
  s = s.replace(/&lt;a?:(\w+):(\d+)&gt;/g, (_, n, id) => `<img class="emoji" src="https://cdn.discordapp.com/emojis/${id}.png?size=48" alt=":${n}:" onerror="this.replaceWith(document.createTextNode(':${n}:'))">`);
  s = s.replace(/&lt;@&amp;(\d+)&gt;/g, (_, id) => `<span class="mention">@${esc((S.roles.find(r => r.id === id) || {}).name || '역할')}</span>`);
  s = s.replace(/&lt;@!?(\d+)&gt;/g, (_, id) => `<span class="mention">@${esc(S.env.users[id]?.name || id.slice(-4))}</span>`);
  s = s.replace(/&lt;#(\d+)&gt;/g, (_, id) => `<span class="mention">#${esc((S.channels.find(c => c.id === id) || {}).name || '채널')}</span>`);
  s = s.replace(/&lt;t:(\d+)(?::([a-zA-Z]))?&gt;/g, (_, t, f) => { const d = new Date(Number(t) * 1000); return f === 'R' ? relTime(d) : d.toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }); });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/__([^_]+)__/g, '<u>$1</u>').replace(/\*([^*\n]+)\*/g, '<i>$1</i>').replace(/~~([^~]+)~~/g, '<s>$1</s>');
  return s;
}
function relTime(d) { const m = Math.round((d - Date.now()) / 60000); const a = Math.abs(m); const u = a >= 1440 ? `${Math.round(a / 1440)}일` : a >= 60 ? `${Math.round(a / 60)}시간` : `${a}분`; return m >= 0 ? `${u} 후` : `${u} 전`; }
function markdown(src) {
  let out = '';
  String(src).split(/```/).forEach((part, i) => {
    if (i % 2 === 1) { out += '<pre>' + esc(part.replace(/^\w*\n/, '').replace(/\n$/, '')) + '</pre>'; return; }
    part.split('\n').forEach((line, idx, arr) => {
      if (line === '' && (idx === 0 || idx === arr.length - 1)) return;
      let m;
      if ((m = line.match(/^# (.*)$/))) out += `<h1>${inline(m[1])}</h1>`;
      else if ((m = line.match(/^## (.*)$/))) out += `<h2>${inline(m[1])}</h2>`;
      else if ((m = line.match(/^### (.*)$/))) out += `<h3>${inline(m[1])}</h3>`;
      else if ((m = line.match(/^-# (.*)$/))) out += `<div class="sub">${inline(m[1])}</div>`;
      else if ((m = line.match(/^> (.*)$/))) out += `<blockquote>${inline(m[1])}</blockquote>`;
      else out += `<div>${inline(line) || '&nbsp;'}</div>`;
    });
  });
  return `<div class="text">${out}</div>`;
}
const emojiHtml = (e) => !e ? '' : e.id ? `<img class="emoji" src="https://cdn.discordapp.com/emojis/${e.id}.png?size=48" alt="" onerror="this.style.display='none'">` : esc(e.name || '');
function fileUrl(u, files) { if (u && u.startsWith('attachment://')) return (files || {})[u.slice(13)] || ''; return u; }

function rc(c, m) {
  const kids = (list) => (list || []).map(x => rc(x, m)).join('');
  switch (c.type) {
    case 17: return `<div class="container" style="--accent:${c.accent_color != null ? '#' + c.accent_color.toString(16).padStart(6, '0') : '#4e5058'}">${kids(c.components)}</div>`;
    case 9: return `<div class="section"><div class="body">${kids(c.components)}</div>${c.accessory ? rc(c.accessory, m) : ''}</div>`;
    case 10: return markdown(c.content || '');
    case 11: { const u = fileUrl(c.media.url, m.files); return u ? `<img class="thumb" src="${esc(u)}" alt="">` : '<div class="thumb"></div>'; }
    case 12: return `<div class="gallery">${(c.items || []).map(it => { const u = fileUrl(it.media.url, m.files); return u ? `<img src="${esc(u)}" alt="">` : '<div class="missing">이미지</div>'; }).join('')}</div>`;
    case 13: return '';
    case 14: return `<hr class="sep${c.divider ? '' : ' nodiv'}">`;
    case 1: return `<div class="row">${kids(c.components)}</div>`;
    case 2: {
      const st = c.style || 2, label = c.label ? inline(c.label) : '';
      if (st === 5) return `<a class="btn s5" href="${esc(c.url)}" target="_blank" rel="noopener" data-link="${esc(c.url)}">${emojiHtml(c.emoji)}${label} ↗</a>`;
      return `<button class="btn s${st}" data-act="click" data-mid="${m.id}" data-cid="${esc(c.custom_id)}"${c.disabled ? ' disabled' : ''}>${emojiHtml(c.emoji)}${label}</button>`;
    }
    case 3: case 5: case 6: case 7: case 8:
      return `<div class="select" data-act="select" data-mid="${m.id}" data-cid="${esc(c.custom_id)}"${c.disabled ? ' disabled' : ''}><span>${esc(c.placeholder || '선택')}</span><span>⌄</span></div>`;
    default: return `<div class="missing">[지원 안 하는 컴포넌트 ${c.type}]</div>`;
  }
}
function embedHtml(e) {
  const col = e.color != null ? '#' + e.color.toString(16).padStart(6, '0') : '#4e5058';
  return `<div class="embed" style="--accent:${col}">${e.author ? `<div>${esc(e.author.name)}</div>` : ''}${e.title ? `<div class="et">${inline(e.title)}</div>` : ''}${e.description ? markdown(e.description) : ''}${(e.fields || []).length ? `<div class="ef">${e.fields.map(f => `<div style="${f.inline ? '' : 'grid-column:1/-1'}"><b>${inline(f.name)}</b>${markdown(f.value)}</div>`).join('')}</div>` : ''}${e.footer ? `<div class="foot">${esc(e.footer.text)}</div>` : ''}</div>`;
}
const timeStr = (t) => new Date(t).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

function renderMsgs() {
  const box = $('#msgs');
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  box.innerHTML = S.messages.length ? S.messages.map(m => {
    const bot = m.author.bot;
    const usedFiles = JSON.stringify(m.components).match(/attachment:\/\/[^"]+/g) || [];
    const extra = Object.entries(m.files || {}).filter(([n]) => !usedFiles.includes('attachment://' + n) && !(m.embeds || []).some(e => JSON.stringify(e).includes('attachment://' + n)));
    const replied = m.replyTo ? S.messages.find(x => x.id === m.replyTo) : null;
    return `<div class="msg${m.ephemeral ? ' eph' : ''}">
      <div class="avatar" style="background:${bot ? '#5865f2' : color(m.author.id)}">${bot ? '🎮' : esc(m.author.name.slice(0, 1))}</div>
      ${m.label ? `<div class="via">↪ <b>${esc(m.label)}</b></div>` : ''}${replied ? `<div class="via">↩ ${esc(replied.author.name)} 에게 답장</div>` : ''}

/* ───────── 슬래시 명령어 입력 ───────── */
const inp = $('#inp'), sug = $('#sug'), optsBox = $('#opts');
let sugIdx = 0;
function showSug() {
  const v = inp.value;
  if (cmd || !v.startsWith('/') || v.includes(' ')) { sug.style.display = 'none'; return; }
  const q = v.slice(1);
  const list = S.commands.filter(c => c.name.includes(q));
  if (!list.length) { sug.style.display = 'none'; return; }
  sugIdx = Math.min(sugIdx, list.length - 1);
  sug.innerHTML = list.map((c, i) => `<div class="it${i === sugIdx ? ' on' : ''}" data-cmd="${esc(c.name)}"><b>/${esc(c.name)}</b><span>${esc(c.description)}</span></div>`).join('');
  sug.style.display = 'block';
  sug.querySelectorAll('.it').forEach(el => el.onmousedown = (ev) => { ev.preventDefault(); pick(el.dataset.cmd); });
}
function pick(name) {
  const def = S.commands.find(c => c.name === name);
  inp.value = ''; sug.style.display = 'none';
  const opts = def.options || [];
  const subs = opts.filter(o => o.type === 1);
  if (!opts.length) { cmd = null; send(name, {}); return; }
  cmd = def; cmdOpts = {};
  if (subs.length) cmdOpts.__sub = subs[0].name;
  renderOpts(); inp.placeholder = `/${name} — 옵션을 채우고 Enter`;
}
function renderOpts() {
  if (!cmd) { optsBox.style.display = 'none'; inp.placeholder = '/ 를 눌러 슬래시 명령어를 쓰거나, 채팅을 입력하세요'; return; }
  const subs = (cmd.options || []).filter(o => o.type === 1);
  const flat = subs.length ? (subs.find(s => s.name === cmdOpts.__sub)?.options || []) : cmd.options;
  optsBox.style.display = 'flex';
  optsBox.innerHTML = `<b style="width:100%">/${esc(cmd.name)}</b>` + (subs.length ? `<label>하위 명령<select data-o="__sub">${subs.map(s => `<option${s.name === cmdOpts.__sub ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select></label>` : '') + flat.map(o => o.type === 6
    ? `<label>${esc(o.name)}${o.required ? ' *' : ''}<select data-o="${esc(o.name)}"><option value="">(선택 안 함)</option>${S.users.map(u => `<option value="${u.id}"${cmdOpts[o.name] === u.id ? ' selected' : ''}>${esc(nameOf(u.id))}</option>`).join('')}</select></label>`
    : o.type === 5 ? `<label>${esc(o.name)}<select data-o="${esc(o.name)}"><option value="true">참</option><option value="false">거짓</option></select></label>`
    : `<label>${esc(o.name)}${o.required ? ' *' : ''}<input data-o="${esc(o.name)}" value="${esc(cmdOpts[o.name] || '')}" placeholder="${esc(o.description || '')}"></label>`).join('');
  optsBox.querySelectorAll('[data-o]').forEach(el => el.onchange = el.oninput = () => { cmdOpts[el.dataset.o] = el.value; if (el.dataset.o === '__sub') renderOpts(); });
  inp.placeholder = `/${cmd.name} — Enter 로 실행 (Esc 취소)`;
}
function send(name, options) { api('/api/slash', { command: name, options, channelId: curChannel() }); }
function submit() {
  if (cmd) { const miss = (cmd.options || []).filter(o => o.required && !cmdOpts[o.name]).map(o => o.name); if (miss.length) return toast(`필수 옵션: ${miss.join(', ')}`); send(cmd.name, cmdOpts); cmd = null; renderOpts(); return; }
  const v = inp.value.trim(); if (!v) return;
  if (v.startsWith('/')) { const n = v.slice(1).split(' ')[0]; if (S.commands.some(c => c.name === n)) { inp.value = ''; return pick(n); } return toast('없는 명령어예요'); }
  inp.value = ''; api('/api/say', { text: v, channelId: curChannel() });
}
inp.oninput = () => { sugIdx = 0; showSug(); };
inp.onkeydown = (ev) => {
  if (ev.key === 'Escape') { cmd = null; renderOpts(); sug.style.display = 'none'; return; }
  if (sug.style.display === 'block') {
    const its = [...sug.querySelectorAll('.it')];
    if (ev.key === 'ArrowDown') { ev.preventDefault(); sugIdx = (sugIdx + 1) % its.length; showSug(); return; }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); sugIdx = (sugIdx - 1 + its.length) % its.length; showSug(); return; }
    if (ev.key === 'Enter' || ev.key === 'Tab') { ev.preventDefault(); pick(its[sugIdx].dataset.cmd); return; }
  }
  if (ev.key === 'Enter') submit();
};
$('#sendBtn').onclick = submit;
$('#restartBtn').onclick = () => { if (confirm('봇 코드를 다시 불러옵니다.
(환경 설정은 유지되고, 메시지·진행 중인 게임은 초기화돼요)')) api('/api/restart'); };

/* ───────── 클릭 · 선택 메뉴 · 모달 ───────── */
function findComp(list, cid) { for (const c of list || []) { if (c.custom_id === cid) return c; const r = findComp(c.components, cid) || (c.accessory && c.accessory.custom_id === cid ? c.accessory : null); if (r) return r; } return null; }
document.addEventListener('click', (ev) => {
  const ch = ev.target.closest('[data-ch]');
  if (ch) { view.channel = ch.dataset.ch; load(); return; }
  const t = ev.target.closest('[data-act]');
  if (!t) { document.querySelectorAll('.pop').forEach(x => x.remove()); return; }
  if (t.dataset.act === 'click' && !t.disabled) api('/api/click', { messageId: t.dataset.mid, customId: t.dataset.cid });
  if (t.dataset.act === 'select' && !t.hasAttribute('disabled')) openSelect(t);
});
function openSelect(el) {
  document.querySelectorAll('.pop').forEach(x => x.remove());
  const m = S.messages.find(x => x.id === el.dataset.mid); if (!m) return;
  const c = findComp(m.components, el.dataset.cid); if (!c) return;
  let options;
  if (c.type === 3) options = (c.options || []).map(o => ({ value: o.value, label: o.label, desc: o.description, emoji: o.emoji, on: !!o.default }));
  else if (c.type === 5) options = S.users.map(u => ({ value: u.id, label: nameOf(u.id) }));
  else if (c.type === 8) options = S.channels.map(x => ({ value: x.id, label: '# ' + x.name }));
  else options = S.roles.map(r => ({ value: r.id, label: '@' + r.name }));
  const max = c.max_values ?? 1, min = c.min_values ?? 1, multi = max > 1;
  const chosen = new Set(options.filter(o => o.on).map(o => o.value));
  const pop = document.createElement('div'); pop.className = 'pop';
  const redraw = () => {
    pop.innerHTML = options.map(o => `<div class="opt${chosen.has(o.value) ? ' on' : ''}" data-v="${esc(o.value)}">${emojiHtml(o.emoji)}<div>${esc(o.label)}${o.desc ? `<small>${esc(o.desc)}</small>` : ''}</div></div>`).join('') + (multi ? `<div class="ok">선택 완료 (${chosen.size}/${max}, 최소 ${min})</div>` : '');
    pop.onclick = (e2) => {
      e2.stopPropagation();
      const o = e2.target.closest('.opt'), ok = e2.target.closest('.ok');
      if (o) {
        if (!multi) { pop.remove(); api('/api/select', { messageId: m.id, customId: c.custom_id, values: [o.dataset.v] }); return; }
        chosen.has(o.dataset.v) ? chosen.delete(o.dataset.v) : (chosen.size < max && chosen.add(o.dataset.v)); redraw();
      } else if (ok) {
        if (chosen.size < min) return toast(`최소 ${min}개를 골라야 해요`);
        pop.remove(); api('/api/select', { messageId: m.id, customId: c.custom_id, values: [...chosen] });
      }
    };
  };
  redraw();
  const row = el.closest('.row') || el.parentElement; row.style.position = 'relative'; row.appendChild(pop);
}

let shownModal = null;
function renderModal() {
  const md = S.modal;

  if (shownModal === md.id) return;

  const fields = [];

    if (c.type === 1) walk(c.components);
    else if (c.type === 18) fields.push({ ...c.component, _label: c.label, _desc: c.description });
    else if (c.type === 4 || c.type === 3) fields.push({ ...c, _label: c.label });

  walk(md.components);
  $('#modal').innerHTML = `<h3>${esc(md.title)}</h3><div class="mb">${fields.map((f, i) => f.type === 'text' ? markdown(f.content)
    : f.type === 3 ? `<label class="l">${esc(f._label)}</label><select data-f="${esc(f.custom_id)}">${(f.options || []).map(o => `<option value="${esc(o.value)}"${o.default ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`
    : `<label class="l">${esc(f._label)}${f.required === false ? '' : ' <span style="color:#f23f42">*</span>'}</label>${f.style === 2 ? `<textarea data-f="${esc(f.custom_id)}" placeholder="${esc(f.placeholder || '')}">${esc(f.value || '')}</textarea>` : `<input data-f="${esc(f.custom_id)}" placeholder="${esc(f.placeholder || '')}" value="${esc(f.value || '')}">`}<div class="err" data-e="${esc(f.custom_id)}"></div>`).join('')}</div>

    fields.filter(f => f.custom_id).forEach(f => {
      const el = $(`#modal [data-f="${CSS.escape(f.custom_id)}"]`); const v = el.value;
      const err = (t) => { bad = true; const e = $(`#modal [data-e="${CSS.escape(f.custom_id)}"]`); if (e) e.textContent = t; };
      if (f.type === 4) {
        if (f.required !== false && !v.trim()) err('필수 항목입니다');
        else if (f.min_length && v.length < f.min_length) err(`${f.min_length}자 이상 입력하세요`);
        else if (f.max_length && v.length > f.max_length) err(`${f.max_length}자 이하로 입력하세요`);
      }

  const first = $('#modal [data-f]'); if (first) first.focus();
}

/* ───────── 갱신 ───────── */
let loading = false, again = false;
async function load() {
  if (loading) { again = true; return; }
  loading = true;
  try {
    const q = view.channel ? `?channel=${encodeURIComponent(view.channel)}` : '';
    S = await fetch(BASE + '/api/state' + q).then(r => r.json());
    if (!view.channel) view.channel = S.env.channelId;
    if (view.channel !== 'dm' && !S.channels.some(c => c.id === view.channel)) view.channel = S.env.channelId;
    renderLeft(); renderMsgs(); renderModal();
    if (tab === 'log' || !$('#uSel') || document.activeElement?.closest?.('#panel') == null) renderPanel();
  } finally { loading = false; if (again) { again = false; load(); } }
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); renderPanel(); });
const es = new EventSource(BASE + '/events');
es.onmessage = (e) => { if (e.data === 'reload') location.reload(); else if (e.data === 'restarting') waitRestart(); else load(); };
es.onerror = () => { $('#conn').style.display = 'block'; };
es.onopen = () => { $('#conn').style.display = 'none'; };
async function waitRestart() { toast('봇 코드를 다시 불러오는 중…'); for (let i = 0; i < 60; i++) { await new Promise(r => setTimeout(r, 700)); try { await fetch(BASE + '/api/state'); location.reload(); return; } catch {} } toast('재시작 실패 — 터미널을 확인하세요'); }
load();
</script>
</body>
</html>
